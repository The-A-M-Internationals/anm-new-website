<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The A&M Internationals — Content & Script Review for Sijith</title>
  <style>
    :root {
      --navy: #0A1636;
      --gold: #C9A84C;
      --gold-dark: #92660A;
      --bg: #F4F6F9;
      --card-bg: #FFFFFF;
      --border: #E2E8F0;
      --text: #1E293B;
      --text-muted: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 30px 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 24px 30px;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(10, 22, 54, 0.15);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-title p {
      font-size: 13px;
      color: #CBD5E1;
      margin-top: 4px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease-in-out;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-gold {
      background: var(--gold);
      color: #0A1636;
    }
    .btn-gold:hover {
      background: #D4AF37;
      transform: translateY(-1px);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .search-box {
      flex: 1;
      min-width: 250px;
    }
    .search-box input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--gold);
    }
    .filter-box select {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 13px;
      background: #fff;
      outline: none;
    }
    .table-container {
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow-x: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    thead {
      background: #F8FAFC;
      border-bottom: 2px solid var(--border);
    }
    th {
      padding: 14px 16px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tbody tr:hover {
      background: #F8FAFC;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-critical { background: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5; }
    .badge-high { background: #FEF3C7; color: #D97706; border: 1px solid #FCD34D; }
    .badge-medium { background: #E0F2FE; color: #0284C7; border: 1px solid #BAE6FD; }
    .badge-low { background: #F1F5F9; color: #64748B; border: 1px solid #CBD5E1; }
    
    .code-loc {
      font-family: monospace;
      font-size: 11px;
      color: #64748B;
      background: #F1F5F9;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    .content-highlight {
      font-weight: 600;
      color: #0F172A;
    }
    .decision-select {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #CBD5E1;
      font-size: 12px;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
    }
    .decision-select.keep { background: #ECFDF5; color: #059669; border-color: #A7F3D0; }
    .decision-select.change { background: #FFFBEB; color: #D97706; border-color: #FDE68A; }
    .decision-select.remove { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }
    
    .notes-input {
      width: 100%;
      min-width: 180px;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      resize: vertical;
      min-height: 40px;
      font-family: inherit;
    }
    .notes-input:focus {
      outline: none;
      border-color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-title">
        <h1>The A&M Internationals — Content Audit & Sign-Off</h1>
        <p>Prepared for Sijith Mathew • Review company claims, metrics, case studies, and brand copy</p>
      </div>
      <div class="actions">
        <button class="btn btn-gold" onclick="window.print()">🖨️ Print / Save as PDF</button>
        <button class="btn btn-outline" onclick="exportData()">💾 Export Sijith's Decisions</button>
      </div>
    </header>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search by section, metric, or file location..." onkeyup="filterTable()">
      </div>
      <div class="filter-box">
        <select id="categoryFilter" onchange="filterTable()">
          <option value="">All Categories</option>
          <option value="Key Company Metric">Company Metrics</option>
          <option value="Featured Client Spotlight">Client Spotlights (TBC)</option>
          <option value="Case Study">Success Stories</option>
          <option value="Brand Slogan / Tagline">Brand Copy & Slogans</option>
          <option value="Executive Bio & Script">Leadership Bios</option>
        </select>
      </div>
      <div class="filter-box">
        <select id="priorityFilter" onchange="filterTable()">
          <option value="">All Priorities</option>
          <option value="Critical">Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
        </select>
      </div>
    </div>

    <div class="table-container">
      <table id="reviewTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Page / Section</th>
            <th>Location & Current Script</th>
            <th>Category</th>
            <th>Question for Sijith</th>
            <th>Sijith's Decision</th>
            <th>Sijith's Notes / Approved Copy</th>
            <th>Priority</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Populated by JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const data = [
      {
        id: "MET-001",
        section: "Homepage > Hero Counter",
        location: "HomeHero.tsx:40",
        content: "150+ Clients Served",
        category: "Key Company Metric",
        question: "Can we keep '150+' clients, or has this number grown (e.g. 180+, 200+)?",
        notes: "If updated, specify the exact number.",
        priority: "High"
      },
      {
        id: "MET-002",
        section: "Homepage > Hero Counter",
        location: "HomeHero.tsx:41",
        content: "12+ Countries",
        category: "Key Company Metric",
        question: "Can we keep '12+ Countries', or has our geographic footprint expanded?",
        notes: "Specify key countries if needed.",
        priority: "High"
      },
      {
        id: "MET-003",
        section: "Homepage > Hero Counter",
        location: "HomeHero.tsx:42",
        content: "10+ Years Experience",
        category: "Key Company Metric",
        question: "Can we keep '10+ Years Experience' or adjust for total leadership combined tenure?",
        notes: "E.g. '12+ Years' or '15+ Years Combined Advisory Experience'.",
        priority: "High"
      },
      {
        id: "MET-004",
        section: "Homepage > Services (Finance)",
        location: "services.content.ts:50",
        content: "40% faster close | 150+ implementations",
        category: "Key Company Metric",
        question: "Are these approved figures for Oracle EPM implementations, or do we have revised go-live stats?",
        notes: "Verify if 150+ is total projects or EPM specific.",
        priority: "High"
      },
      {
        id: "MET-005",
        section: "Homepage > Services (AI)",
        location: "services.content.ts:140",
        content: "80% routine tasks automated | 10x faster decision making",
        category: "Key Company Metric",
        question: "Can we keep '80% automated' and '10x faster decisions', or do you prefer different KPIs?",
        notes: "Alternative: '99.5% processing accuracy'.",
        priority: "Medium"
      },
      {
        id: "CLI-001",
        section: "Homepage > Our Clients",
        location: "OurClients.tsx",
        content: "TBC Corporation (Midas, Big O Tires, Tire Kingdom) • -50%+ Faster Financial Close",
        category: "Featured Client Spotlight",
        question: "Can we publicly display TBC Corporation by name and logo under NDA, or should we anonymize to 'North American Automotive Retail Titan'?",
        notes: "Confirm if -50% close speed is the approved figure.",
        priority: "Critical"
      },
      {
        id: "CLI-002",
        section: "Homepage > Success Stories #1",
        location: "successStory.content.ts:25",
        content: "Global Manufacturing Corp (Automotive) • 87% Faster Reporting",
        category: "Case Study",
        question: "Can we keep this case anonymous as 'Global Manufacturing Corp', or replace with real client details?",
        notes: "Specify if you prefer named client or anonymous moniker.",
        priority: "High"
      },
      {
        id: "CLI-003",
        section: "Homepage > Success Stories #2",
        location: "successStory.content.ts:43",
        content: "Regional Healthcare Network • 100% audit compliance",
        category: "Case Study",
        question: "Can we keep this anonymous healthcare case, or update the script to reflect a specific EPM healthcare client?",
        notes: "Can link to specific Health Network EPM case.",
        priority: "High"
      },
      {
        id: "CLI-004",
        section: "Homepage > Success Stories #3",
        location: "successStory.content.ts:61",
        content: "Financial Services Leader (Insurance) • 4x Transaction Speed",
        category: "Case Study",
        question: "Can we keep this insurance case study, or should we feature a UAE / GCC regional banking or investment client?",
        notes: "Consider adding UAE / GCC regional financial case.",
        priority: "High"
      },
      {
        id: "CPY-001",
        section: "Homepage > Hero Slogan",
        location: "homeHero.content.ts:6",
        content: "'Elevating the World, Elegantly'",
        category: "Brand Slogan / Tagline",
        question: "Can we keep the company slogan, or do you want to sharpen it to an Oracle EPM & Financial Architecture focus?",
        notes: "Current slogan is also running in the footer marquee.",
        priority: "High"
      },
      {
        id: "CPY-002",
        section: "Homepage > Hero Description",
        location: "homeHero.content.ts:14",
        content: "Mentions 'digital marketing solutions that drive measurable impact...'",
        category: "Brand Slogan / Tagline",
        question: "Action: The script still says 'digital marketing solutions'. Should we change to 'Specialized Oracle EPM, financial consolidation, and AI automations'?",
        notes: "RECOMMENDED TO CHANGE: Purge digital marketing reference.",
        priority: "Critical"
      },
      {
        id: "CPY-003",
        section: "Homepage > About Us Narrative",
        location: "aboutUs.content.ts:28",
        content: "'...enhance operational efficiency, and accelerate digital transformation.'",
        category: "Brand Slogan / Tagline",
        question: "Can we keep this, or update 'accelerate digital transformation' to 'accelerate financial transformation & Oracle EPM excellence'?",
        notes: "Align terminology across About Us and Services.",
        priority: "High"
      },
      {
        id: "LEAD-001",
        section: "Leadership > Sijith Mathew",
        location: "leadershipTeam.content.ts:58",
        content: "SIJITH MATHEW • 'Driving innovation and operational excellence.'",
        category: "Executive Bio & Script",
        question: "Sijith, can we keep your current bio and title as written, or would you like to update your biography, executive credentials, and quote?",
        notes: "Please write any approved updates or new quote.",
        priority: "Critical"
      },
      {
        id: "LEAD-002",
        section: "Leadership > Anusha Anala",
        location: "leadershipTeam.content.ts:23",
        content: "ANUSHA ANALA • Founder • '15+ years of experience in enterprise performance...'",
        category: "Executive Bio & Script",
        question: "Can we keep Anusha's bio and the '15+ years experience' claim as-is, or are there any updates required?",
        notes: "Confirm role and tenure accuracy.",
        priority: "High"
      },
      {
        id: "OPS-001",
        section: "Footer & Contact > Headquarters",
        location: "footer.content.ts & offices.content.ts",
        content: "Office C1 - 1F - SF6017, Ajman Free Zone C1 Building, Ajman Free Zone, UAE",
        category: "Corporate Data",
        question: "Is this the correct official headquarters address to display across all footers and contact pages?",
        notes: "Verify office room number.",
        priority: "High"
      },
      {
        id: "OPS-004",
        section: "Global Nav & Footer",
        location: "Navbar.tsx & Footer.tsx",
        content: "Oracle Partner / Cloud EPM Specialist Alliance",
        category: "Partnership Accreditation",
        question: "What is our exact official Oracle PartnerNetwork (OPN) designation tier to state in the script?",
        notes: "Ensure alignment with official OPN guidelines.",
        priority: "Critical"
      }
    ];

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      data.forEach(item => {
        const tr = document.createElement("tr");
        tr.dataset.category = item.category;
        tr.dataset.priority = item.priority;

        const priorityClass = `badge-${item.priority.toLowerCase()}`;

        tr.innerHTML = `
          <td><strong>${item.id}</strong></td>
          <td><strong>${item.section}</strong></td>
          <td>
            <div class="content-highlight">${item.content}</div>
            <div class="code-loc">${item.location}</div>
          </td>
          <td>${item.category}</td>
          <td>${item.question}</td>
          <td style="min-width: 140px;">
            <select class="decision-select" onchange="updateDecisionStyle(this)">
              <option value="">-- Select Decision --</option>
              <option value="KEEP">✅ KEEP</option>
              <option value="CHANGE">✏️ CHANGE SCRIPT</option>
              <option value="REMOVE">❌ REMOVE</option>
            </select>
          </td>
          <td>
            <textarea class="notes-input" placeholder="${item.notes}"></textarea>
          </td>
          <td><span class="badge ${priorityClass}">${item.priority}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateDecisionStyle(select) {
      select.className = "decision-select " + select.value.toLowerCase();
    }

    function filterTable() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const cat = document.getElementById("categoryFilter").value;
      const prio = document.getElementById("priorityFilter").value;

      const rows = document.querySelectorAll("#tableBody tr");
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        const rowCat = row.dataset.category;
        const rowPrio = row.dataset.priority;

        const matchesSearch = text.includes(search);
        const matchesCat = !cat || rowCat.includes(cat);
        const matchesPrio = !prio || rowPrio === prio;

        row.style.display = (matchesSearch && matchesCat && matchesPrio) ? "" : "none";
      });
    }

    function exportData() {
      let exportText = "ID\tSection\tCurrent Content\tQuestion\tSijith Decision\tSijith Notes\n";
      const rows = document.querySelectorAll("#tableBody tr");
      rows.forEach(row => {
        const id = row.cells[0].innerText.trim();
        const section = row.cells[1].innerText.trim();
        const content = row.cells[2].querySelector('.content-highlight').innerText.trim();
        const question = row.cells[4].innerText.trim();
        const decision = row.cells[5].querySelector('select').value || "PENDING";
        const notes = row.cells[6].querySelector('textarea').value.trim();
        exportText += `${id}\t${section}\t${content}\t${question}\t${decision}\t${notes}\n`;
      });

      const blob = new Blob([exportText], { type: 'text/tab-separated-values;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Sijith_Decisions_Export.tsv";
      link.click();
    }

    renderTable();
  </script>
</body>
</html>
